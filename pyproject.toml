[project]
name = "mapng-ai"
version = "0.1.0"
description = "Locally-run tool that generates BeamNG.drive maps from real-world locations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lee" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "numpy>=2.0",
    "pillow>=11.0",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mercantile>=1.2",
    "trimesh>=4.5",
    "pycollada>=0.8",
    "pygltflib>=1.16",
    "fast-simplification>=0.1",
    "scipy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
