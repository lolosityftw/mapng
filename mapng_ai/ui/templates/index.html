<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MapNG-AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="/static/app.css?v=__BUILD__" />
</head>
<body>

<header>
  <h1>MapNG-AI</h1>
  <div class="header-right">
    <span class="lib-status" id="lib-status">library: …</span>
    <a href="/library" class="ghost-link">Open library →</a>
    <span class="status" id="status">idle</span>
  </div>
</header>

<main>

  <section id="map-pane">
    <h2>1. Pick a 2 km area</h2>
    <div id="map"></div>
    <div class="controls">
      <div class="bbox-readout" id="bbox-readout">draw a rectangle on the map</div>
      <button id="generate" disabled>Generate</button>
    </div>
  </section>

  <section id="progress-pane">
    <h2>2. Pipeline</h2>
    <ol id="stages"></ol>
    <div id="downloads" hidden>
      <h3>Artifacts</h3>
      <ul id="download-list"></ul>
    </div>
  </section>

  <section id="preview-pane">
    <h2>3. Preview</h2>
    <div class="preview-bar">
      <label>Mesh quality
        <select id="quality">
          <option value="low">Low (256 px) · ~9 MB GPU</option>
          <option value="medium" selected>Medium (512 px) · ~36 MB GPU</option>
          <option value="high">High (1024 px) · ~140 MB GPU</option>
          <option value="ultra">Ultra (full size) · ~575 MB GPU</option>
        </select>
      </label>
      <span id="scene-size" class="scene-size"></span>
    </div>
    <div id="preview"></div>
    <small class="hint">Drag to orbit · scroll to zoom · drop quality if FPS lags.</small>
  </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>
<script type="module" src="/static/preview.js?v=__BUILD__"></script>
<script src="/static/app.js?v=__BUILD__"></script>
</body>
</html>
