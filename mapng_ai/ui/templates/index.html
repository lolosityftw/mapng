<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MapNG-AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="/static/app.css?v=__BUILD__" />
</head>
<body>

<header>
  <h1>MapNG-AI</h1>
  <div class="header-right">
    <span class="lib-status" id="lib-status">library: …</span>
    <a href="/library" class="ghost-link">Asset browser →</a>
    <span class="status" id="status">idle</span>
  </div>
</header>

<main>

  <section id="map-pane">
    <h2>1. Pick a 2 km area</h2>
    <div id="map"></div>
    <div class="controls">
      <select id="preset" title="Jump the map to a known location">
        <option value="">(presets)</option>
        <option value="cookstown_rural">Cookstown rural (default)</option>
        <option value="cookstown_town">Cookstown town centre</option>
        <option value="belfast_west">Belfast — west</option>
        <option value="giants_causeway">Giant's Causeway</option>
        <option value="newcastle_mournes">Newcastle / Mourne</option>
      </select>
      <div class="bbox-readout" id="bbox-readout">draw a rectangle on the map</div>
      <button id="generate" disabled>Generate</button>
    </div>
  </section>

  <section id="progress-pane">
    <h2>2. Pipeline</h2>
    <ol id="stages"></ol>
    <div id="downloads" hidden>
      <h3>Artifacts</h3>
      <ul id="download-list"></ul>
    </div>
  </section>

  <section id="preview-pane">
    <div class="pane-head">
      <h2>3. Preview</h2>
      <button id="preview-fullscreen" class="ghost" title="Fullscreen (F)">⛶ Fullscreen</button>
    </div>
    <div class="preview-bar">
      <span class="quality-readout" id="quality-readout">quality: …</span>
      <span id="scene-size" class="scene-size"></span>
    </div>
    <div id="preview"></div>
    <small class="hint">Drag to orbit · scroll to zoom · drop quality if FPS lags.</small>
  </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>
<script type="module" src="/static/preview.js?v=__BUILD__"></script>
<script src="/static/app.js?v=__BUILD__"></script>
</body>
</html>
